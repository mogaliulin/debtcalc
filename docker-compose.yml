services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: debts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-debts}
      POSTGRES_DB: debts
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debts"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://debts:${POSTGRES_PASSWORD:-debts}@db:5432/debts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
